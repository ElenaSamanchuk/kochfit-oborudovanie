  Страница:

<div id="kochfit-equipment-wrap" style="width:100%;line-height:0;">
  <iframe
    id="kochfit-equipment-frame"
    src="https://elenasamanchuk.github.io/kochfit-oborudovanie/"
    title="Оборудование Kochfit"
    loading="lazy"
    style="width:100%;border:0;display:block;min-height:600px;overflow:hidden;"
  ></iframe>
</div>
<script>
(function () {
  var RESIZE_TYPE = 'kochfit-equipment-resize';
  var MODAL_TYPE = 'kochfit-equipment-modal';
  var VIEWPORT_TYPE = 'kochfit-equipment-viewport';
  var PING_TYPE = 'kochfit-equipment-ping';
  var CLOSE_TYPE = 'kochfit-equipment-modal-close';

  var wrap = document.getElementById('kochfit-equipment-wrap');
  var iframe = document.getElementById('kochfit-equipment-frame');
  if (!iframe || !wrap) return;

  var modalOpen = false;
  var lockedScrollY = 0;
  var lastContentHeight = 0;
  var siteDim = null;
  var iframeStyleSaved = false;
  var html = document.documentElement;
  var body = document.body;
  var prev = {
    htmlOverflow: '',
    bodyOverflow: '',
    bodyPosition: '',
    bodyTop: '',
    bodyLeft: '',
    bodyRight: '',
    bodyWidth: '',
    iframeCssText: ''
  };

  function viewSize() {
    var vv = window.visualViewport;
    if (vv) {
      return {
        top: vv.offsetTop || 0,
        height: vv.height || window.innerHeight || html.clientHeight || 0
      };
    }
    return {
      top: 0,
      height: window.innerHeight || html.clientHeight || 0
    };
  }

  function applyHeight(height) {
    if (!height || height < 100) return;
    lastContentHeight = height;
    if (modalOpen) return;
    iframe.style.height = height + 'px';
  }

  function sendFixedViewport() {
    if (!modalOpen) return;
    try {
      iframe.contentWindow.postMessage({
        type: VIEWPORT_TYPE,
        mode: 'fixed',
        offsetTop: 0,
        height: viewSize().height
      }, '*');
    } catch (e) {}
  }

  function requestClose() {
    try {
      iframe.contentWindow.postMessage({ type: CLOSE_TYPE }, '*');
    } catch (e) {}
  }

  function onBlockScroll(event) {
    if (!modalOpen) return;
    // Скролл внутри iframe (попап) не трогаем — событие там своё.
    // Блокируем скролл/жест на странице Тильды.
    event.preventDefault();
  }

  function bindScrollBlock(bind) {
    var opts = { passive: false, capture: true };
    var method = bind ? 'addEventListener' : 'removeEventListener';
    window[method]('wheel', onBlockScroll, opts);
    window[method]('touchmove', onBlockScroll, opts);
    document[method]('wheel', onBlockScroll, opts);
    document[method]('touchmove', onBlockScroll, opts);
  }

  function lockScroll() {
    if (html.dataset.kochfitScrollLock === '1') return;
    lockedScrollY = window.scrollY || window.pageYOffset || 0;
    prev.htmlOverflow = html.style.overflow;
    prev.bodyOverflow = body.style.overflow;
    prev.bodyPosition = body.style.position;
    prev.bodyTop = body.style.top;
    prev.bodyLeft = body.style.left;
    prev.bodyRight = body.style.right;
    prev.bodyWidth = body.style.width;

    html.style.overflow = 'hidden';
    body.style.overflow = 'hidden';
    body.style.position = 'fixed';
    body.style.top = '-' + lockedScrollY + 'px';
    body.style.left = '0';
    body.style.right = '0';
    body.style.width = '100%';

    // Тильда часто скроллит не body, а служебные контейнеры
    ['#allrecords', '.t-body', '.t-records', '#t-header', '#t-footer'].forEach(function (sel) {
      document.querySelectorAll(sel).forEach(function (el) {
        if (el.dataset.kochfitPrevOverflow != null) return;
        el.dataset.kochfitPrevOverflow = el.style.overflow || '';
        el.style.overflow = 'hidden';
      });
    });

    html.dataset.kochfitScrollLock = '1';
    bindScrollBlock(true);
  }

  function unlockScroll() {
    if (html.dataset.kochfitScrollLock !== '1') return;
    html.style.overflow = prev.htmlOverflow;
    body.style.overflow = prev.bodyOverflow;
    body.style.position = prev.bodyPosition;
    body.style.top = prev.bodyTop;
    body.style.left = prev.bodyLeft;
    body.style.right = prev.bodyRight;
    body.style.width = prev.bodyWidth;

    document.querySelectorAll('[data-kochfit-prev-overflow]').forEach(function (el) {
      el.style.overflow = el.dataset.kochfitPrevOverflow;
      delete el.dataset.kochfitPrevOverflow;
    });

    delete html.dataset.kochfitScrollLock;
    bindScrollBlock(false);
    window.scrollTo(0, lockedScrollY);
  }

  function showSiteDim() {
    if (siteDim) return;
    siteDim = document.createElement('div');
    siteDim.id = 'kochfit-equipment-site-dim';
    siteDim.setAttribute('aria-hidden', 'true');
    siteDim.style.cssText = [
      'position:fixed',
      'inset:0',
      'z-index:999990',
      'background:rgba(0,0,0,0.4)',
      'opacity:0',
      'transition:opacity .2s ease'
    ].join(';');
    siteDim.addEventListener('click', requestClose);
    document.body.appendChild(siteDim);
    requestAnimationFrame(function () {
      if (siteDim) siteDim.style.opacity = '1';
    });
  }

  function hideSiteDim() {
    if (!siteDim) return;
    var el = siteDim;
    siteDim = null;
    el.style.opacity = '0';
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 200);
  }

  function fullscreenIframe() {
    if (!iframeStyleSaved) {
      prev.iframeCssText = iframe.getAttribute('style') || '';
      iframeStyleSaved = true;
    }
    var view = viewSize();
    iframe.style.position = 'fixed';
    iframe.style.top = view.top + 'px';
    iframe.style.left = '0';
    iframe.style.right = '0';
    iframe.style.bottom = 'auto';
    iframe.style.width = '100%';
    iframe.style.height = view.height + 'px';
    iframe.style.maxHeight = 'none';
    iframe.style.minHeight = '0';
    iframe.style.zIndex = '999991';
    iframe.style.border = '0';
    iframe.style.display = 'block';
    iframe.style.background = '#fff';
    // Внутренний скролл iframe сбрасываем — попап position:fixed к новому viewport
    try {
      iframe.contentWindow.scrollTo(0, 0);
    } catch (e) {}
  }

  function restoreIframe() {
    if (iframeStyleSaved) {
      iframe.setAttribute('style', prev.iframeCssText || '');
      iframeStyleSaved = false;
    }
    if (lastContentHeight > 0) {
      iframe.style.height = lastContentHeight + 'px';
    }
  }

  function setModalOpen(open) {
    open = !!open;
    if (modalOpen === open) {
      if (open) {
        fullscreenIframe();
        sendFixedViewport();
      }
      return;
    }
    modalOpen = open;
    if (modalOpen) {
      lockScroll();
      showSiteDim();
      fullscreenIframe();
      sendFixedViewport();
      requestAnimationFrame(function () {
        fullscreenIframe();
        sendFixedViewport();
      });
      setTimeout(function () {
        fullscreenIframe();
        sendFixedViewport();
      }, 50);
      setTimeout(sendFixedViewport, 200);
    } else {
      restoreIframe();
      hideSiteDim();
      unlockScroll();
    }
  }

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === RESIZE_TYPE) {
      applyHeight(Number(data.height));
      return;
    }
    if (data.type === MODAL_TYPE) {
      setModalOpen(!!data.open);
    }
  });

  window.addEventListener('resize', function () {
    if (!modalOpen) return;
    fullscreenIframe();
    sendFixedViewport();
  });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () {
      if (!modalOpen) return;
      fullscreenIframe();
      sendFixedViewport();
    }, 120);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', function () {
      if (!modalOpen) return;
      fullscreenIframe();
      sendFixedViewport();
    });
    window.visualViewport.addEventListener('scroll', function () {
      if (!modalOpen) return;
      fullscreenIframe();
      sendFixedViewport();
    });
  }

  iframe.addEventListener('load', function () {
    try {
      iframe.contentWindow.postMessage({ type: PING_TYPE }, '*');
    } catch (e) {}
  });
})();
</script>
