<div id="kochfit-equipment-wrap" style="width:100%;line-height:0;">
  <iframe
    id="kochfit-equipment-frame"
    src="https://elenasamanchuk.github.io/kochfit-oborudovanie/"
    title="Оборудование Kochfit"
    loading="lazy"
    style="width:100%;border:0;display:block;min-height:600px;overflow:hidden;"
  ></iframe>
</div>
<script>
(function () {
  var RESIZE_TYPE = 'kochfit-equipment-resize';
  var MODAL_TYPE = 'kochfit-equipment-modal';
  var VIEWPORT_TYPE = 'kochfit-equipment-viewport';
  var PING_TYPE = 'kochfit-equipment-ping';
  var CLOSE_TYPE = 'kochfit-equipment-modal-close';

  var wrap = document.getElementById('kochfit-equipment-wrap');
  var iframe = document.getElementById('kochfit-equipment-frame');
  if (!iframe || !wrap) return;

  var modalOpen = false;
  var lockedScrollY = 0;
  var lastContentHeight = 0;
  var siteDim = null;
  var layerSaved = false;
  var scrollBlocked = false;
  var chromeHidden = [];
  var html = document.documentElement;
  var body = document.body;
  var prev = {
    wrapPosition: '',
    wrapZ: '',
    iframePosition: '',
    iframeZ: '',
    htmlOverflow: '',
    bodyOverflow: '',
    htmlPaddingRight: '',
    bodyPaddingRight: '',
    htmlOverscroll: '',
    bodyOverscroll: ''
  };
  var DIM_Z = '2147483000';
  var FRAME_Z = '2147483001';

  /* ---------- Плавный скролл колёсиком (desktop) ---------- */
  var smoothEnabled = !(
    window.matchMedia &&
    window.matchMedia('(prefers-reduced-motion: reduce)').matches
  );
  // На тач-устройствах оставляем нативный скролл
  var isTouch = 'ontouchstart' in window || navigator.maxTouchPoints > 0;
  var smoothCurrent = window.scrollY || 0;
  var smoothTarget = smoothCurrent;
  var smoothRaf = 0;
  var EASE = 0.085;

  function maxScroll() {
    var docH = Math.max(
      body.scrollHeight,
      html.scrollHeight,
      body.offsetHeight,
      html.offsetHeight
    );
    return Math.max(0, docH - (window.innerHeight || html.clientHeight || 0));
  }

  function stopSmooth() {
    if (smoothRaf) {
      cancelAnimationFrame(smoothRaf);
      smoothRaf = 0;
    }
    smoothCurrent = window.scrollY || 0;
    smoothTarget = smoothCurrent;
  }

  function smoothStep() {
    smoothRaf = 0;
    if (modalOpen || !smoothEnabled) return;
    smoothCurrent += (smoothTarget - smoothCurrent) * EASE;
    if (Math.abs(smoothTarget - smoothCurrent) < 0.4) {
      smoothCurrent = smoothTarget;
      window.scrollTo(0, smoothCurrent);
      return;
    }
    window.scrollTo(0, smoothCurrent);
    smoothRaf = requestAnimationFrame(smoothStep);
  }

  function onSmoothWheel(event) {
    if (modalOpen || !smoothEnabled || isTouch) return;
    // Не перехватываем скролл внутри полей/чужих overflow-контейнеров
    var el = event.target;
    if (el && el.closest) {
      var scrollable = el.closest('textarea, select, .t-popup, .t-zoomable, [data-kochfit-native-scroll]');
      if (scrollable) return;
    }

    event.preventDefault();
    var dy = event.deltaY;
    if (event.deltaMode === 1) dy *= 16;
    if (event.deltaMode === 2) dy *= window.innerHeight || 800;

    // чуть мягче реакция на колесо
    smoothTarget = Math.max(0, Math.min(maxScroll(), smoothTarget + dy));
    if (!smoothRaf) smoothRaf = requestAnimationFrame(smoothStep);
  }

  if (smoothEnabled && !isTouch) {
    window.addEventListener('wheel', onSmoothWheel, { passive: false, capture: true });
    window.addEventListener('scroll', function () {
      if (modalOpen || smoothRaf) return;
      smoothCurrent = window.scrollY || 0;
      smoothTarget = smoothCurrent;
    }, { passive: true });
  }

  /* ---------- Iframe / modal ---------- */
  function applyHeight(height) {
    if (!height || height < 100) return;
    lastContentHeight = height;
    if (modalOpen) return;
    iframe.style.height = height + 'px';
  }

  function visibleSlice() {
    var rect = iframe.getBoundingClientRect();
    var vv = window.visualViewport;
    var viewTop = vv ? vv.offsetTop : 0;
    var viewHeight = vv ? vv.height : (window.innerHeight || html.clientHeight || 0);
    var viewBottom = viewTop + viewHeight;

    var visibleTop = Math.max(rect.top, viewTop);
    var visibleBottom = Math.min(rect.bottom, viewBottom);
    var height = Math.max(0, visibleBottom - visibleTop);
    var offsetTop = Math.max(0, visibleTop - rect.top);

    if (height < 120) {
      height = Math.min(viewHeight, iframe.offsetHeight || viewHeight);
      offsetTop = Math.max(0, -rect.top);
    }

    return {
      offsetTop: Math.round(offsetTop),
      height: Math.round(height)
    };
  }

  function sendViewport() {
    if (!modalOpen) return;
    var slice = visibleSlice();
    try {
      iframe.contentWindow.postMessage({
        type: VIEWPORT_TYPE,
        mode: 'slice',
        offsetTop: slice.offsetTop,
        height: slice.height
      }, '*');
    } catch (e) {}
  }

  function requestClose() {
    try {
      iframe.contentWindow.postMessage({ type: CLOSE_TYPE }, '*');
    } catch (e) {}
  }

  function onBlockScroll(event) {
    if (!modalOpen) return;
    event.preventDefault();
  }

  function onBlockKeys(event) {
    if (!modalOpen) return;
    var keys = ['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', 'Home', 'End', ' ', 'Spacebar'];
    if (keys.indexOf(event.key) !== -1) event.preventDefault();
  }

  function bindScrollBlock(bind) {
    if (bind === scrollBlocked) return;
    scrollBlocked = bind;
    var opts = { passive: false, capture: true };
    var method = bind ? 'addEventListener' : 'removeEventListener';
    window[method]('wheel', onBlockScroll, opts);
    window[method]('touchmove', onBlockScroll, opts);
    document[method]('wheel', onBlockScroll, opts);
    document[method]('touchmove', onBlockScroll, opts);
    window[method]('keydown', onBlockKeys, opts);
  }

  function scrollbarWidth() {
    return Math.max(0, window.innerWidth - html.clientWidth);
  }

  // overflow:hidden + компенсация скроллбара; без scrollTo-отката (он давал дёрганье)
  function lockScroll() {
    if (html.dataset.kochfitScrollLock === '1') return;
    stopSmooth();
    lockedScrollY = window.scrollY || window.pageYOffset || 0;
    smoothCurrent = lockedScrollY;
    smoothTarget = lockedScrollY;

    prev.htmlOverflow = html.style.overflow;
    prev.bodyOverflow = body.style.overflow;
    prev.htmlPaddingRight = html.style.paddingRight;
    prev.bodyPaddingRight = body.style.paddingRight;
    prev.htmlOverscroll = html.style.overscrollBehavior;
    prev.bodyOverscroll = body.style.overscrollBehavior;

    var sbw = scrollbarWidth();
    html.style.overflow = 'hidden';
    body.style.overflow = 'hidden';
    html.style.overscrollBehavior = 'none';
    body.style.overscrollBehavior = 'none';
    if (sbw > 0) {
      html.style.paddingRight = sbw + 'px';
      body.style.paddingRight = sbw + 'px';
    }

    html.dataset.kochfitScrollLock = '1';
    bindScrollBlock(true);
  }

  function unlockScroll() {
    if (html.dataset.kochfitScrollLock !== '1') {
      bindScrollBlock(false);
      return;
    }
    html.style.overflow = prev.htmlOverflow;
    body.style.overflow = prev.bodyOverflow;
    html.style.paddingRight = prev.htmlPaddingRight;
    body.style.paddingRight = prev.bodyPaddingRight;
    html.style.overscrollBehavior = prev.htmlOverscroll;
    body.style.overscrollBehavior = prev.bodyOverscroll;
    delete html.dataset.kochfitScrollLock;
    bindScrollBlock(false);
    stopSmooth();
  }

  function showSiteDim() {
    if (siteDim) return;
    siteDim = document.createElement('div');
    siteDim.id = 'kochfit-equipment-site-dim';
    siteDim.setAttribute('aria-hidden', 'true');
    siteDim.style.cssText = [
      'position:fixed',
      'inset:0',
      'z-index:' + DIM_Z,
      'background:rgba(0,0,0,0.4)',
      'opacity:0',
      'transition:opacity .2s ease',
      'touch-action:none'
    ].join(';');
    siteDim.addEventListener('click', requestClose);
    siteDim.addEventListener('wheel', onBlockScroll, { passive: false });
    siteDim.addEventListener('touchmove', onBlockScroll, { passive: false });
    document.body.appendChild(siteDim);
    requestAnimationFrame(function () {
      if (siteDim) siteDim.style.opacity = '1';
    });
  }

  function hideSiteDim() {
    if (!siteDim) return;
    var el = siteDim;
    siteDim = null;
    el.style.opacity = '0';
    setTimeout(function () {
      if (el.parentNode) el.parentNode.removeChild(el);
    }, 200);
  }

  // Липкое меню Тильды оказывается «между» затемнением и iframe и выглядит обрезанным
  function hideTildaChrome() {
    restoreTildaChrome();
    var seen = [];
    function hideEl(el) {
      if (!el || seen.indexOf(el) !== -1) return;
      if (el === wrap || wrap.contains(el) || el === siteDim) return;
      if (el.id === 'kochfit-equipment-site-dim') return;
      seen.push(el);
      chromeHidden.push({
        el: el,
        visibility: el.style.visibility,
        pointerEvents: el.style.pointerEvents,
        opacity: el.style.opacity
      });
      el.style.visibility = 'hidden';
      el.style.pointerEvents = 'none';
      el.style.opacity = '0';
    }

    [
      '#t-header',
      '.t-header',
      '.t-header__fixedcontainer',
      '.t-header__wrapper',
      '.t-header__container',
      '.t450',
      '.t282',
      '.tmenu-mobile',
      '.t-menuburger',
      '.t396__filter'
    ].forEach(function (sel) {
      document.querySelectorAll(sel).forEach(hideEl);
    });

    // На случай кастомного sticky/fixed меню сверху
    Array.prototype.forEach.call(document.body.querySelectorAll('*'), function (el) {
      if (seen.indexOf(el) !== -1 || wrap.contains(el) || el === wrap || el === siteDim) return;
      var cs = window.getComputedStyle(el);
      if (cs.position !== 'fixed' && cs.position !== 'sticky') return;
      var r = el.getBoundingClientRect();
      if (r.width < (window.innerWidth || 0) * 0.45) return;
      if (r.height < 28 || r.height > 160) return;
      if (r.top > 90 || r.bottom < 0) return;
      hideEl(el);
    });
  }

  function restoreTildaChrome() {
    chromeHidden.forEach(function (item) {
      item.el.style.visibility = item.visibility;
      item.el.style.pointerEvents = item.pointerEvents;
      item.el.style.opacity = item.opacity;
    });
    chromeHidden = [];
  }

  function elevateLayer(on) {
    if (on) {
      if (!layerSaved) {
        prev.wrapPosition = wrap.style.position;
        prev.wrapZ = wrap.style.zIndex;
        prev.iframePosition = iframe.style.position;
        prev.iframeZ = iframe.style.zIndex;
        layerSaved = true;
      }
      wrap.style.position = 'relative';
      wrap.style.zIndex = FRAME_Z;
      iframe.style.position = 'relative';
      iframe.style.zIndex = FRAME_Z;
      return;
    }
    if (!layerSaved) return;
    wrap.style.position = prev.wrapPosition;
    wrap.style.zIndex = prev.wrapZ;
    iframe.style.position = prev.iframePosition;
    iframe.style.zIndex = prev.iframeZ;
    layerSaved = false;
  }

  function setModalOpen(open) {
    open = !!open;
    if (modalOpen === open) {
      if (open) sendViewport();
      return;
    }
    modalOpen = open;
    if (modalOpen) {
      lockScroll();
      hideTildaChrome();
      showSiteDim();
      elevateLayer(true);
      sendViewport();
      requestAnimationFrame(sendViewport);
      setTimeout(sendViewport, 50);
      setTimeout(sendViewport, 200);
    } else {
      elevateLayer(false);
      hideSiteDim();
      restoreTildaChrome();
      unlockScroll();
    }
  }

  window.addEventListener('message', function (event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === RESIZE_TYPE) {
      applyHeight(Number(data.height));
      return;
    }
    if (data.type === MODAL_TYPE) {
      setModalOpen(!!data.open);
    }
  });

  window.addEventListener('resize', sendViewport);
  window.addEventListener('orientationchange', function () {
    setTimeout(sendViewport, 120);
  });
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', sendViewport);
    window.visualViewport.addEventListener('scroll', sendViewport);
  }

  iframe.addEventListener('load', function () {
    try {
      iframe.contentWindow.postMessage({ type: PING_TYPE }, '*');
    } catch (e) {}
  });
})();
</script>
