<body>
<div id="app"></div>

<style id="kochfit-embed-reset">
  @font-face {
    font-family: "Evolventa";
    src: url("./fonts/Evolventa-Regular.otf") format("opentype");
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Evolventa";
    src: url("./fonts/Evolventa-Bold.otf") format("opentype");
    font-weight: 700;
    font-style: normal;
    font-display: swap;
  }
  @font-face {
    font-family: "Evolventa";
    src: url("./fonts/Evolventa-Bold.otf") format("opentype");
    font-weight: 600;
    font-style: normal;
    font-display: swap;
  }
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
  }
  body { min-height: 0; }

  .page-leave-active,
  .view-enter-active,
  .view-leave-active,
  .tip-enter-active,
  .tip-leave-active,
  .rise-enter-active,
  .collapse-enter-active,
  .collapse-leave-active {
    transition: opacity .3s ease-in-out, transform .3s ease-in-out, height .3s ease-in-out, margin .3s ease-in-out !important;
  }
  #app .card-lift,
  #app .pressable,
  #app a,
  #app button {
    transition: color .3s ease-in-out, background-color .3s ease-in-out, border-color .3s ease-in-out, transform .3s ease-in-out, box-shadow .3s ease-in-out, opacity .3s ease-in-out !important;
  }
  #app .type-section,
  #app .btn-text,
  #app h1.type-section {
    font-family: "Evolventa", sans-serif !important;
  }
  #app, #app * {
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }
  /* Шкала: ширина = целевой %, длительность задаёт JS от величины % */
  .importance-fill {
    width: var(--importance-target, 0%) !important;
    transform: scaleX(0);
    transform-origin: left center;
    transition: transform var(--importance-duration, 1.5s) ease-in-out var(--reveal-delay, 0s);
    will-change: transform;
  }
  [data-reveal="in"] .importance-fill,
  [data-reveal="in"].importance-fill {
    transform: scaleX(1);
  }
  @media (prefers-reduced-motion: reduce) {
    .importance-fill {
      transition: none !important;
      transform: scaleX(1) !important;
    }
  }
  html.kochfit-modal-open.kochfit-await-viewport .fixed.inset-0 {
    opacity: 0 !important;
    pointer-events: none !important;
  }
  /* Ограничиваем модалку видимой областью внутри высокого iframe */
  html.kochfit-modal-open:not(.kochfit-iframe-fixed) .fixed.inset-0 {
    top: var(--kochfit-vis-top, 0px) !important;
    right: 0 !important;
    bottom: auto !important;
    left: 0 !important;
    height: var(--kochfit-vis-height, 100vh) !important;
    max-height: var(--kochfit-vis-height, 100vh) !important;
  }
  /* Когда родитель растянул iframe на экран — обычный fixed на весь viewport */
  html.kochfit-modal-open.kochfit-iframe-fixed .fixed.inset-0 {
    top: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    left: 0 !important;
    height: auto !important;
    max-height: none !important;
  }
  html.kochfit-modal-open,
  html.kochfit-modal-open body {
    overflow: hidden !important;
    overscroll-behavior: none !important;
  }
  html.kochfit-modal-open body {
    touch-action: none;
  }
  html.kochfit-modal-open .fixed.inset-0 {
    overscroll-behavior: contain;
    touch-action: pan-y;
  }
  html.kochfit-modal-open [role="dialog"] {
    touch-action: pan-y;
  }
  html.kochfit-modal-open.kochfit-iframe-fixed,
  html.kochfit-modal-open.kochfit-iframe-fixed body {
    overflow: hidden !important;
    overscroll-behavior: none;
  }
  /* Плавное закрытие попапа */
  .kochfit-modal-leaving {
    transition: opacity .3s ease-in-out !important;
    opacity: 0 !important;
    pointer-events: none !important;
  }
  .kochfit-modal-leaving [role="dialog"] {
    transition: opacity .3s ease-in-out, transform .3s ease-in-out !important;
    opacity: 0 !important;
    transform: translateY(8px) !important;
  }
  .kochfit-modal-leaving [aria-hidden="true"] {
    transition: opacity .3s ease-in-out !important;
    opacity: 0 !important;
  }
  /* Modal shop/promo row: wrap + padding fallback for Tilda embed */
  #app [role="dialog"] .bg-blue-soft.rounded-lg {
    flex-wrap: wrap !important;
    row-gap: 0.375rem !important;
    padding: 0.625rem 0.875rem !important;
  }
  #app [role="dialog"] .bg-blue-soft.rounded-lg > span {
    min-width: 0;
  }

<script>
(function () {
  var RESIZE_TYPE = 'kochfit-equipment-resize';
  var MODAL_TYPE = 'kochfit-equipment-modal';
  var VIEWPORT_TYPE = 'kochfit-equipment-viewport';

  var CLOSE_TYPE = 'kochfit-equipment-modal-close';

  } else {
    boot();
  }
})();
</script>

<script>
(function () {
  // ~одинаковая скорость заполнения: больше % → дольше анимация
  var MS_PER_PERCENT = 26;
  var MIN_DURATION = 450;
  var MAX_DURATION = 2800;

  function easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  function durationForTarget(target) {
    return Math.round(Math.max(MIN_DURATION, Math.min(MAX_DURATION, target * MS_PER_PERCENT)));
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function animateCard(root) {
    if (!root) return;
    var countEl = root.querySelector('[data-importance-count]');
    var barEl = root.querySelector('[data-importance-bar]');
    if (!countEl && !barEl) return;

    var target = Number((countEl && countEl.dataset.target) || (barEl && barEl.dataset.target) || 0);
    if (!isFinite(target)) target = 0;
    target = Math.max(0, Math.min(100, target));
    var duration = durationForTarget(target);

    // Если Vue снова сбросил процент в 0% — анимируем заново
    var countReset = countEl && (countEl.textContent || '').trim() === '0%' && target > 0;
    if (root.dataset.importanceAnimated === '1' && !countReset) return;
    if (root.dataset.importanceCounting === '1') return;

    root.dataset.importanceAnimated = '1';

    var delay = 0;
    var delayVar = getComputedStyle(root).getPropertyValue('--reveal-delay').trim();
    if (delayVar) {
      var parsed = parseFloat(delayVar);
      if (!isNaN(parsed)) delay = parsed;
    }

    function finish() {
      if (countEl) countEl.textContent = Math.round(target) + '%';
      if (barEl) {
        barEl.style.transform = 'scaleX(1)';
        barEl.style.transition = 'none';
      }
    }

    if (prefersReducedMotion()) {
      finish();
      return;
    }

    // Готовим шкалу к анимации: сброс + reflow, длительность от величины %
    if (barEl) {
      barEl.style.setProperty('--importance-duration', duration + 'ms');
      barEl.style.transition = 'none';
      barEl.style.transformOrigin = 'left center';
      barEl.style.transform = 'scaleX(0)';
      barEl.style.width = target + '%';
      void barEl.offsetWidth;
      barEl.style.transition = 'transform ' + duration + 'ms ease-in-out';
    }

    root.dataset.importanceCounting = '1';
    setTimeout(function () {
      if (barEl) barEl.style.transform = 'scaleX(1)';

      if (!countEl) {
        delete root.dataset.importanceCounting;
        return;
      }

      var start = performance.now();
      function frame(now) {
        var t = Math.min(1, (now - start) / duration);
        var value = Math.round(target * easeInOut(t));
        countEl.textContent = value + '%';
        if (t < 1) requestAnimationFrame(frame);
        else {
          countEl.textContent = Math.round(target) + '%';
          delete root.dataset.importanceCounting;
        }
      }
      requestAnimationFrame(frame);
    }, delay);
  }

  function scan() {
    document.querySelectorAll('[data-reveal="in"]').forEach(function (el) {
      animateCard(el);
      // reveal may sit on a wrapper; also try nested articles
      el.querySelectorAll && el.querySelectorAll('article').forEach(animateCard);
    });
    // fallback: if reveal already applied to article itself
    document.querySelectorAll('article[data-reveal="in"]').forEach(animateCard);
  }

  function boot() {
    scan();
    if (typeof MutationObserver !== 'undefined') {
      new MutationObserver(scan).observe(document.documentElement, {
        subtree: true,
        childList: true,
        attributes: true,
        attributeFilter: ['data-reveal']
      });
    }
    [200, 600, 1200].forEach(function (ms) { setTimeout(scan, ms); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

</body>
</html>
