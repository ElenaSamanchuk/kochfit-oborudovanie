<body>
<div id="app"></div>

<style id="kochfit-embed-reset">
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  body { min-height: 0; }
  html.kochfit-modal-open .fixed.inset-0 {
    top: var(--kochfit-vis-top, 0px) !important;
    right: 0 !important;
    bottom: auto !important;
    left: 0 !important;
    height: var(--kochfit-vis-height, 100vh) !important;
    max-height: var(--kochfit-vis-height, 100vh) !important;
  }
</style>
<script>
(function () {
  var RESIZE_TYPE = 'kochfit-equipment-resize';
  var MODAL_TYPE = 'kochfit-equipment-modal';
  var VIEWPORT_TYPE = 'kochfit-equipment-viewport';
  var PING_TYPE = 'kochfit-equipment-ping';
  var CLOSE_TYPE = 'kochfit-equipment-modal-close';
  var lastHeight = 0;
  var raf = 0;
  var modalOpen = false;
  var inIframe = window.parent && window.parent !== window;

  function measure() {
    var doc = document.documentElement;
    var body = document.body;
    if (!body) return 0;
    return Math.ceil(Math.max(
      body.scrollHeight,
      body.offsetHeight,
      doc.clientHeight,
      doc.scrollHeight,
      doc.offsetHeight
    ));
  }

  function sendHeight() {
    raf = 0;
    if (modalOpen) return;
    var height = measure();
    if (!height || Math.abs(height - lastHeight) < 2) return;
    lastHeight = height;
    if (inIframe) {
      window.parent.postMessage({ type: RESIZE_TYPE, height: height }, '*');
    }
  }

  function scheduleHeight() {
    if (raf) return;
    raf = requestAnimationFrame(sendHeight);
  }

  function applyViewport(offsetTop, height) {
    var top = Math.max(0, Math.round(Number(offsetTop) || 0));
    var h = Math.max(120, Math.round(Number(height) || 0));
    document.documentElement.style.setProperty('--kochfit-vis-top', top + 'px');
    document.documentElement.style.setProperty('--kochfit-vis-height', h + 'px');
  }

  function setModalOpen(open) {
    if (modalOpen === open) {
      if (open && inIframe) {
        window.parent.postMessage({ type: MODAL_TYPE, open: true }, '*');
      }
      return;
    }
    modalOpen = open;
    document.documentElement.classList.toggle('kochfit-modal-open', open);
    if (!open) {
      document.documentElement.style.removeProperty('--kochfit-vis-top');
      document.documentElement.style.removeProperty('--kochfit-vis-height');
    }
    if (inIframe) {
      window.parent.postMessage({ type: MODAL_TYPE, open: open }, '*');
    } else if (open) {
      var vv = window.visualViewport;
      applyViewport(vv ? vv.offsetTop : 0, vv ? vv.height : window.innerHeight);
    }
  }

  function isModalPresent() {
    return !!document.querySelector('[role="dialog"][aria-modal="true"]');
  }

  function syncModalState() {
    setModalOpen(isModalPresent());
  }

  function onMessage(event) {
    var data = event.data;
    if (!data || typeof data !== 'object') return;
    if (data.type === PING_TYPE) {
      scheduleHeight();
      if (modalOpen) setModalOpen(true);
      return;
    }
    if (data.type === VIEWPORT_TYPE) {
      applyViewport(data.offsetTop, data.height);
      return;
    }
    if (data.type === CLOSE_TYPE) {
      var dialog = document.querySelector('[role="dialog"][aria-modal="true"]');
      if (dialog && dialog.parentElement) {
        var backdrop = dialog.parentElement.querySelector('[aria-hidden="true"]');
        if (backdrop) {
          backdrop.click();
          return;
        }
      }
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
    }
  }

  function boot() {
    window.addEventListener('message', onMessage);
    window.addEventListener('load', scheduleHeight);
    window.addEventListener('resize', scheduleHeight);
    window.addEventListener('orientationchange', scheduleHeight);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', function () {
        if (!inIframe && modalOpen) {
          applyViewport(window.visualViewport.offsetTop, window.visualViewport.height);
        }
        scheduleHeight();
      });
      window.visualViewport.addEventListener('scroll', function () {
        if (!inIframe && modalOpen) {
          applyViewport(window.visualViewport.offsetTop, window.visualViewport.height);
        }
      });
    }
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(scheduleHeight).catch(function () {});
    }
    if (typeof ResizeObserver !== 'undefined' && document.body) {
      new ResizeObserver(scheduleHeight).observe(document.body);
    }
    if (typeof MutationObserver !== 'undefined' && document.documentElement) {
      new MutationObserver(function () {
        syncModalState();
        scheduleHeight();
      }).observe(document.documentElement, {
        childList: true,
        subtree: true,
        attributes: true,
        characterData: true
      });
    }
    [100, 300, 800, 1600, 3000].forEach(function (ms) {
      setTimeout(scheduleHeight, ms);
    });
    syncModalState();
    scheduleHeight();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

<script>
(function () {
  var DURATION = 1100;

  function easeOutExpo(t) {
    return t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
  }

  function prefersReducedMotion() {
    return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  }

  function animateCard(root) {
    if (!root || root.dataset.importanceAnimated === '1') return;
    var countEl = root.querySelector('[data-importance-count]');
    var barEl = root.querySelector('[data-importance-bar]');
    if (!countEl && !barEl) return;

    root.dataset.importanceAnimated = '1';
    var target = Number((countEl && countEl.dataset.target) || (barEl && barEl.dataset.target) || 0);
    if (!isFinite(target)) target = 0;
    target = Math.max(0, Math.min(100, target));

    var delay = 0;
    var delayVar = getComputedStyle(root).getPropertyValue('--reveal-delay').trim();
    if (delayVar) {
      var parsed = parseFloat(delayVar);
      if (!isNaN(parsed)) delay = parsed;
    }

    function finish() {
      if (countEl) countEl.textContent = Math.round(target) + '%';
      if (barEl) barEl.style.width = target + '%';
    }

    if (prefersReducedMotion()) {
      finish();
      return;
    }

    setTimeout(function () {
      if (barEl) {
        // force start frame
        barEl.style.width = '0%';
        void barEl.offsetWidth;
        barEl.style.width = target + '%';
      }

      if (!countEl) return;
      var start = performance.now();
      function frame(now) {
        var t = Math.min(1, (now - start) / DURATION);
        var value = Math.round(target * easeOutExpo(t));
        countEl.textContent = value + '%';
        if (t < 1) requestAnimationFrame(frame);
        else countEl.textContent = Math.round(target) + '%';
      }
      requestAnimationFrame(frame);
    }, delay);
  }

  function scan() {
    document.querySelectorAll('[data-reveal="in"]').forEach(function (el) {
      animateCard(el);
      // reveal may sit on a wrapper; also try nested articles
      el.querySelectorAll && el.querySelectorAll('article').forEach(animateCard);
    });
    // fallback: if reveal already applied to article itself
    document.querySelectorAll('article[data-reveal="in"]').forEach(animateCard);
  }

  function boot() {
    scan();
    if (typeof MutationObserver !== 'undefined') {
      new MutationObserver(scan).observe(document.documentElement, {
        subtree: true,
        childList: true,
        attributes: true,
        attributeFilter: ['data-reveal']
      });
    }
    [200, 600, 1200].forEach(function (ms) { setTimeout(scan, ms); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>
